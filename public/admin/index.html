<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SLOT — private desk</title><link rel="icon" href="../icon.svg"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="admin.css"><script src="admin.js" type="module"></script></head><body><header class="top"><a class="wordmark" href="../" aria-label="SLOT home">SLOT</a><a class="icon-button" href="../" aria-label="Back to SLOT">↗</a></header><main class="desk"><h1 class="sr-only">Code generator</h1><section class="desk-section"><h2>New code</h2><form id="code-form"><label for="label">A private label <span>(optional)</span></label><input id="label" maxlength="40" placeholder="Coffee with…" autocomplete="off"><label for="minutes">Expires in</label><select id="minutes"><option value="30">30 minutes</option><option value="15">15 minutes</option></select><button class="light-button" type="submit">Generate code ↗</button></form><div id="fresh-pass" hidden><label for="fresh-code">Copy it now. It won’t be shown again.</label><input id="fresh-code" readonly autocomplete="off"><button id="copy" class="light-button" type="button">Copy code</button><p id="expiry"></p></div></section><section class="desk-section"><h2>Codes</h2><div id="passes"></div></section><section class="desk-section"><h2>Gmail</h2><p id="mail-status">Checking connection…</p><button id="connect" class="light-button" type="button" hidden>Connect Gmail ↗</button><p id="deliveries"></p><p class="small">Only sending permission. No inbox reading or calendar access. Unknown deliveries are held for review, never blindly resent.</p></section><p id="admin-status" role="status" aria-live="polite"></p></main></body></html>
